# serve.sh 展示用配置（本机实测：内网 10.0.0.14，公网 1.117.229.156 / trashbox.tech）

[common]
log = /home/ubuntu/KBot/.serve.log
lan_host = 10.0.0.14
public_host = trashbox.tech
public_scheme = https

[main]
# KOOK 长连接，无 HTTP
listen_host =
listen_port =
path =
source =
expose_public = 0
public_url =

[order]
listen_host =
listen_port =
path =
source =
expose_public = 0
public_url =

[broadcast]
listen_host =
listen_port =
path =
source =
expose_public = 0
public_url =

[gsi]
# CSGO GSI，游戏客户端推到本机 3000；不走 trashbox.tech
listen_host = 0.0.0.0
listen_port = 3000
path = /
source = CS/GSI/GSI_server.py
expose_public = 0
public_url =

[web]
# CS/Web/API.py：榜单页 /web/ 、数据 /api/data
listen_host = 0.0.0.0
listen_port = 5000
path = /web/
source = CS/Web/API.py
expose_public = 1
public_url = https://trashbox.tech/web/

[music]
# MusicBot：Flask API + Vue 构建产物，Nginx 反代到 /Music；属于默认启动组
listen_host = 0.0.0.0
listen_port = 8004
path = /Music/
source = MusicBot/run.py
expose_public = 1
public_url = https://trashbox.tech/Music/
